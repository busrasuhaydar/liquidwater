<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liquid Gradient Effect</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      touch-action: none;
      font-family: 'Montserrat', sans-serif;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
    }

    #canvas {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .info {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #fff;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
      pointer-events: none;
      z-index: 10;
    }

    .info h1 {
      font-size: 3rem;
      font-weight: 600;
      margin-bottom: 1rem;
      letter-spacing: 2px;
    }

    .info p {
      font-size: 1.2rem;
      font-weight: 300;
      opacity: 0.9;
    }

    @media (max-width: 768px) {
      .info h1 {
        font-size: 2rem;
      }

      .info p {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="canvas"></canvas>
    <div class="info">
      <h1>Liquid Gradient Effect</h1>
      <p>Move your mouse to interact</p>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // Vertex Shader
    const vertexShader = `
      uniform float uTime;
      uniform vec2 uMouse;
      uniform float uDisplacement;

      varying vec2 vUv;
      varying float vWave;

      // 3D Simplex noise
      vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
      vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
      vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
      vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

      float snoise(vec3 v) {
        const vec2 C = vec2(1.0/6.0, 1.0/3.0);
        const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);

        vec3 i  = floor(v + dot(v, C.yyy));
        vec3 x0 = v - i + dot(i, C.xxx);

        vec3 g = step(x0.yzx, x0.xyz);
        vec3 l = 1.0 - g;
        vec3 i1 = min(g.xyz, l.zxy);
        vec3 i2 = max(g.xyz, l.zxy);

        vec3 x1 = x0 - i1 + C.xxx;
        vec3 x2 = x0 - i2 + C.yyy;
        vec3 x3 = x0 - D.yyy;

        i = mod289(i);
        vec4 p = permute(permute(permute(
          i.z + vec4(0.0, i1.z, i2.z, 1.0))
          + i.y + vec4(0.0, i1.y, i2.y, 1.0))
          + i.x + vec4(0.0, i1.x, i2.x, 1.0));

        float n_ = 0.142857142857;
        vec3 ns = n_ * D.wyz - D.xzx;

        vec4 j = p - 49.0 * floor(p * ns.z * ns.z);

        vec4 x_ = floor(j * ns.z);
        vec4 y_ = floor(j - 7.0 * x_);

        vec4 x = x_ *ns.x + ns.yyyy;
        vec4 y = y_ *ns.x + ns.yyyy;
        vec4 h = 1.0 - abs(x) - abs(y);

        vec4 b0 = vec4(x.xy, y.xy);
        vec4 b1 = vec4(x.zw, y.zw);

        vec4 s0 = floor(b0)*2.0 + 1.0;
        vec4 s1 = floor(b1)*2.0 + 1.0;
        vec4 sh = -step(h, vec4(0.0));

        vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
        vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;

        vec3 p0 = vec3(a0.xy, h.x);
        vec3 p1 = vec3(a0.zw, h.y);
        vec3 p2 = vec3(a1.xy, h.z);
        vec3 p3 = vec3(a1.zw, h.w);

        vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
        p0 *= norm.x;
        p1 *= norm.y;
        p2 *= norm.z;
        p3 *= norm.w;

        vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
        m = m * m;
        return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
      }

      void main() {
        vUv = uv;

        vec3 pos = position;
        float distanceToMouse = distance(uv, uMouse);

        // Multiple layers of noise for complex liquid effect
        float noise1 = snoise(vec3(pos.x * 2.0 + uTime * 0.3, pos.y * 2.0, uTime * 0.2));
        float noise2 = snoise(vec3(pos.x * 3.0 - uTime * 0.2, pos.y * 3.0, uTime * 0.3));
        float noise3 = snoise(vec3(pos.x * 1.5 + uTime * 0.1, pos.y * 1.5 - uTime * 0.15, uTime * 0.4));

        // Mouse interaction
        float mouseEffect = smoothstep(0.4, 0.0, distanceToMouse) * 0.5;

        // Combine noises
        float wave = (noise1 * 0.5 + noise2 * 0.3 + noise3 * 0.2 + mouseEffect) * uDisplacement;

        pos.z += wave;

        vWave = wave;

        gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
      }
    `;

    // Fragment Shader
    const fragmentShader = `
      uniform float uTime;
      uniform vec3 uColor1;
      uniform vec3 uColor2;
      uniform vec3 uColor3;
      uniform vec2 uMouse;

      varying vec2 vUv;
      varying float vWave;

      void main() {
        // Dynamic gradient based on position and time
        float gradient1 = vUv.y + sin(vUv.x * 3.0 + uTime * 0.5) * 0.1;
        float gradient2 = vUv.x + cos(vUv.y * 3.0 + uTime * 0.3) * 0.1;

        // Mix colors
        vec3 color = mix(uColor1, uColor2, gradient1);
        color = mix(color, uColor3, gradient2 * 0.5);

        // Add wave influence
        color += vWave * 0.1;

        // Mouse glow effect
        float distToMouse = distance(vUv, uMouse);
        float glow = smoothstep(0.3, 0.0, distToMouse) * 0.3;
        color += vec3(glow);

        // Add subtle shimmer
        float shimmer = sin(vUv.x * 10.0 + vUv.y * 10.0 + uTime * 2.0) * 0.02;
        color += shimmer;

        gl_FragColor = vec4(color, 1.0);
      }
    `;

    class LiquidEffect {
      constructor(canvas) {
        this.canvas = canvas;
        this.scene = new THREE.Scene();
        this.camera = new THREE.PerspectiveCamera(
          75,
          window.innerWidth / window.innerHeight,
          0.1,
          1000
        );
        this.renderer = new THREE.WebGLRenderer({
          canvas: this.canvas,
          antialias: true,
          alpha: false
        });

        this.mouse = new THREE.Vector2(0.5, 0.5);
        this.targetMouse = new THREE.Vector2(0.5, 0.5);

        this.init();
        this.addEventListeners();
        this.animate();
      }

      init() {
        // Renderer setup
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // Camera position
        this.camera.position.z = 1;

        // Create liquid plane
        this.uniforms = {
          uTime: { value: 0 },
          uMouse: { value: this.mouse },
          uDisplacement: { value: 0.3 },
          uColor1: { value: new THREE.Color('#667eea') }, // Purple blue
          uColor2: { value: new THREE.Color('#764ba2') }, // Purple
          uColor3: { value: new THREE.Color('#f093fb') }  // Pink
        };

        const geometry = new THREE.PlaneGeometry(2, 2, 128, 128);
        const material = new THREE.ShaderMaterial({
          vertexShader,
          fragmentShader,
          uniforms: this.uniforms,
          side: THREE.DoubleSide
        });

        this.plane = new THREE.Mesh(geometry, material);
        this.scene.add(this.plane);
      }

      addEventListeners() {
        window.addEventListener('resize', () => this.onResize());
        window.addEventListener('mousemove', (e) => this.onMouseMove(e));
        window.addEventListener('touchmove', (e) => this.onTouchMove(e));
      }

      onResize() {
        this.camera.aspect = window.innerWidth / window.innerHeight;
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(window.innerWidth, window.innerHeight);
      }

      onMouseMove(event) {
        this.targetMouse.x = event.clientX / window.innerWidth;
        this.targetMouse.y = 1.0 - (event.clientY / window.innerHeight);
      }

      onTouchMove(event) {
        if (event.touches.length > 0) {
          this.targetMouse.x = event.touches[0].clientX / window.innerWidth;
          this.targetMouse.y = 1.0 - (event.touches[0].clientY / window.innerHeight);
        }
      }

      animate() {
        requestAnimationFrame(() => this.animate());

        // Smooth mouse movement
        this.mouse.x += (this.targetMouse.x - this.mouse.x) * 0.05;
        this.mouse.y += (this.targetMouse.y - this.mouse.y) * 0.05;

        // Update uniforms
        this.uniforms.uTime.value += 0.01;
        this.uniforms.uMouse.value = this.mouse;

        this.renderer.render(this.scene, this.camera);
      }

      // Public methods for customization
      setColors(color1, color2, color3) {
        this.uniforms.uColor1.value = new THREE.Color(color1);
        this.uniforms.uColor2.value = new THREE.Color(color2);
        this.uniforms.uColor3.value = new THREE.Color(color3);
      }

      setDisplacement(value) {
        this.uniforms.uDisplacement.value = value;
      }
    }

    // Initialize
    const canvas = document.getElementById('canvas');
    const liquidEffect = new LiquidEffect(canvas);

    // Example: Uncomment to change colors
    // liquidEffect.setColors('#FF6B6B', '#4ECDC4', '#45B7D1');

    // Example: Uncomment to change displacement
    // liquidEffect.setDisplacement(0.5);

    // Make it globally accessible for console experiments
    window.liquidEffect = liquidEffect;
  </script>
</body>
</html>
